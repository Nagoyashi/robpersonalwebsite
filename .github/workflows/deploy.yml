name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages.
# Triggers:
#  - push to main          (deploy the new commit)
#  - daily schedule        (rebuild to refresh GitHub-sourced fleet data)
#  - manual dispatch
#
# Data freshness: the fleet/log/now data is fetched at BUILD time. The daily
# cron re-runs the build so versions/releases stay current without any
# cross-repo wiring. (Instant rebuild-on-release is a separate later upgrade.)
#
# Auth: if the read-only GitHub App secrets are configured, we mint a short-
# lived installation token and pass it to the build as FLEET_GITHUB_TOKEN (a
# non-PUBLIC_ env var — never bundled to the client). If not configured, the
# build falls back to the default GITHUB_TOKEN (public repos only) and
# products.ts fallbacks for private repos.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.FLEET_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mint read-only GitHub App token (if configured)
        id: apptoken
        if: ${{ env.APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: Nagoyashi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          FLEET_GITHUB_TOKEN: ${{ steps.apptoken.outputs.token || secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
