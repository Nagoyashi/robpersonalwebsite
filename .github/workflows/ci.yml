name: CI

# The required `validate` check. The site is now an Astro project (see
# DECISIONS.md ADR-005), so validation = type-check + a full production build.
# A successful build proves: templates compile, content collections parse,
# internal links resolve, and the build-time GitHub data layer degrades
# gracefully (this job runs WITHOUT the App secret, so private repos fall back
# to products.ts — exactly the resilience we want to guarantee).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build (no App secret — proves graceful fallback)
        env:
          FLEET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
