version: 2

# The site is an Astro project (ADR-005), so we keep two ecosystems current:
# the GitHub Actions in .github/workflows/, and the npm dependencies in
# package.json.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "chore"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
